[project]
name = "shared-models"
version = "0.1.0"
description = "Schemas Pydantic partagés entre les API"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
